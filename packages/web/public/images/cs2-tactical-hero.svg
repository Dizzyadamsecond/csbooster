<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" fill="none">
  <defs>
    <!-- Deep Obsidian Ambient Radial Glows -->
    <radialGradient id="esportsGlowWhite" cx="80%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#d4d4d8" stop-opacity="0.08"/>
      <stop offset="85%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="esportsGlowSilver" cx="20%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#71717a" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>

    <!-- Tournament Dynamic Chevrons (Monochrome Silver/White) -->
    <linearGradient id="chevronGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a1a1aa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#141416" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="chevronGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4d4d8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="esportsGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.06"/>
      <circle cx="48" cy="48" r="1.25" fill="#ffffff" fill-opacity="0.18"/>
    </pattern>

    <!-- Scanline Subtle Accent -->
    <linearGradient id="scanbeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1440" height="480" fill="#080808"/>
  <rect width="1440" height="480" fill="url(#esportsGrid)"/>
  <rect width="1440" height="480" fill="url(#esportsGlowWhite)"/>
  <rect width="1440" height="480" fill="url(#esportsGlowSilver)"/>

  <!-- High-Tech CS2 Tournament Chevrons (Blade Stream) -->
  <g transform="translate(780, 40)" opacity="0.85">
    <polygon points="50,0 95,0 35,400 -10,400" fill="url(#chevronGrad1)"/>
    <polygon points="115,0 145,0 85,400 55,400" fill="url(#chevronGrad2)"/>
    <polygon points="160,0 178,0 118,400 100,400" fill="url(#chevronGrad2)" opacity="0.5"/>
    <polygon points="190,0 200,0 140,400 130,400" fill="url(#chevronGrad2)" opacity="0.25"/>
  </g>

  <!-- Tournament Tactical Reticle & Radar Rings -->
  <g transform="translate(1180, 240)" opacity="0.75">
    <circle r="210" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="6 8"/>
    <circle r="155" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.2"/>
    <circle r="105" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="24 10"/>
    <circle r="50" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <!-- Crosshair Lines -->
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Target Brackets -->
    <path d="M -18 -8 L -8 -8 L -8 -18 M 18 -8 L 8 -8 L 8 -18 M -18 8 L -8 8 L -8 18 M 18 8 L 8 8 L 8 18" stroke="#ffffff" stroke-width="2.5"/>
    <circle r="4" fill="#ffffff"/>
  </g>

  <!-- Grounding Telemetry Waveform -->
  <path d="M 0 420 L 520 420 L 545 390 L 570 445 L 595 350 L 620 455 L 645 375 L 670 420 L 1440 420" stroke="url(#scanbeam)" stroke-width="1.5" fill="none"/>
</svg>
