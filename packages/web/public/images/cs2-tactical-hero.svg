<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" fill="none">
  <defs>
    <!-- Dark Deep Ambient Radial Glows -->
    <radialGradient id="esportsGlowPrimary" cx="80%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#1d4ed8" stop-opacity="0.20"/>
      <stop offset="85%" stop-color="#06080f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="esportsGlowCyan" cx="20%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06080f" stop-opacity="0"/>
    </radialGradient>

    <!-- Tournament Dynamic Chevrons -->
    <linearGradient id="chevronGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="chevronGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="esportsGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#3b82f6" stroke-width="0.75" stroke-opacity="0.07"/>
      <circle cx="48" cy="48" r="1.25" fill="#60a5fa" fill-opacity="0.22"/>
    </pattern>

    <!-- Scanline Subtle Accent -->
    <linearGradient id="scanbeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1440" height="480" fill="#06080f"/>
  <rect width="1440" height="480" fill="url(#esportsGrid)"/>
  <rect width="1440" height="480" fill="url(#esportsGlowPrimary)"/>
  <rect width="1440" height="480" fill="url(#esportsGlowCyan)"/>

  <!-- High-Tech CS2 Tournament Chevrons (Blade Stream) -->
  <g transform="translate(780, 40)" opacity="0.85">
    <polygon points="50,0 95,0 35,400 -10,400" fill="url(#chevronGrad1)"/>
    <polygon points="115,0 145,0 85,400 55,400" fill="url(#chevronGrad2)"/>
    <polygon points="160,0 178,0 118,400 100,400" fill="url(#chevronGrad2)" opacity="0.5"/>
    <polygon points="190,0 200,0 140,400 130,400" fill="url(#chevronGrad2)" opacity="0.25"/>
  </g>

  <!-- Tournament Tactical Reticle & Radar Rings -->
  <g transform="translate(1180, 240)" opacity="0.70">
    <circle r="210" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="6 8"/>
    <circle r="155" stroke="#2563eb" stroke-opacity="0.25" stroke-width="1.2"/>
    <circle r="105" stroke="#60a5fa" stroke-opacity="0.40" stroke-width="1.5" stroke-dasharray="24 10"/>
    <circle r="50" stroke="#93c5fd" stroke-opacity="0.65" stroke-width="1"/>
    <!-- Crosshair Lines -->
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Target Brackets -->
    <path d="M -18 -8 L -8 -8 L -8 -18 M 18 -8 L 8 -8 L 8 -18 M -18 8 L -8 8 L -8 18 M 18 8 L 8 8 L 8 18" stroke="#38bdf8" stroke-width="2.5"/>
    <circle r="4" fill="#ffffff"/>
  </g>

  <!-- Grounding Telemetry Waveform -->
  <path d="M 0 420 L 520 420 L 545 390 L 570 445 L 595 350 L 620 455 L 645 375 L 670 420 L 1440 420" stroke="url(#scanbeam)" stroke-width="2" fill="none"/>
</svg>
